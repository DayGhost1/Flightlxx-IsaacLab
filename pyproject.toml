[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightlxx-isaaclab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["source/flightlxx_isaaclab"]

[tool.pytest.ini_options]
pythonpath = ["source/flightlxx_isaaclab"]
testpaths = ["tests"]
